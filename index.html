<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un pequeño universo 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo -->
    <div class="space" id="space">
        <div class="nebula one"></div>
        <div class="nebula two"></div>
    </div>


    <!-- =========================
         PANTALLA 1
    ========================== -->

    <section class="screen active" id="screen1">

        <div class="universe">

            <div class="universe-title">

                <h1>
                    Un pequeño <span>universo</span> para ti 🌻
                </h1>

                <p>
                    Dicen que las flores también pueden tener
                    su propio universo...
                </p>

            </div>


            <!-- Órbitas -->
            <div class="orbit orbit1"></div>
            <div class="orbit orbit2"></div>
            <div class="orbit orbit3"></div>
            <div class="orbit orbit4"></div>
            <div class="orbit orbit5"></div>


            <!-- Girasol central -->

            <div class="sunflower">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="sunflower-center"></div>

            </div>


            <button class="start" id="start">
                Entrar al universo 🌻
            </button>

        </div>

    </section>


    <!-- =========================
         PANTALLA 2
    ========================== -->

    <section class="screen hidden" id="screen2">

        <div class="second">

            <button class="back" id="back">
                ← Volver
            </button>


            <!-- Flores flotantes -->

            <div class="floating-flower" style="left:5%;top:10%">🌻</div>
            <div class="floating-flower" style="left:85%;top:13%">🌻</div>
            <div class="floating-flower" style="left:12%;top:42%">🌻</div>
            <div class="floating-flower" style="left:88%;top:45%">🌻</div>
            <div class="floating-flower" style="left:4%;top:75%">🌻</div>
            <div class="floating-flower" style="left:91%;top:72%">🌻</div>


            <!-- Cofres -->

            <div class="chest" style="left:5%;top:22%">🎁</div>
            <div class="chest" style="right:7%;top:25%">🎁</div>
            <div class="chest" style="left:8%;top:60%">🎁</div>
            <div class="chest" style="right:8%;top:65%">🎁</div>
            <div class="chest" style="left:25%;top:85%">🎁</div>
            <div class="chest" style="right:25%;top:88%">🎁</div>


            <!-- Carta -->

            <div class="card">

                <h2>🌻 Para ti 🌻</h2>

                <p id="texto"></p>

            </div>


            <!-- Respuesta -->

            <div class="response">

                <h3>
                    Ahora te toca a ti... 💌
                </h3>

                <p>
                    Después de recibir este pequeño detalle,
                    puedes dejarme tu respuesta aquí.
                </p>

                <textarea
                    id="respuesta"
                    placeholder="Escribe aquí lo que quieras decirme..."></textarea>

                <button class="send" id="send">
                    Guardar mi respuesta ✨
                </button>

                <div class="reply-result" id="replyResult"></div>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
